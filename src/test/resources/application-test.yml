spring:
  application:
    name: read-service
  datasource:
    url: jdbc:postgresql://localhost:5432/temporal_rift
    username: temporal_rift
    password: temporal_rift
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never actually fetched — TestSecurityConfig overrides the JwtDecoder bean so this URI's
          # discovery document is never requested; this value only needs to satisfy property resolution.
          issuer-uri: https://test-issuer.invalid
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: PLAINTEXT

notification:
  websocket:
    # Self-contained copy so the test suite never depends on a live Config Server.
    allowed-origins: http://localhost:*
    send-time-limit: 10s
    send-buffer-size: 512KB
    max-pending-messages: 256

logging:
  level:
    io.github.temporalrift: DEBUG
